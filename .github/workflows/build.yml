name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.20.1"
            dir: forge-1.20.1
            java: "17"
          - mc: "1.21.1"
            dir: forge-1.21.1
            java: "21"
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip
        run: |
          echo "--- repo root:"; ls -la
          Z=$(ls friend-forge-repo*.zip 2>/dev/null | head -1)
          if [ -z "$Z" ]; then Z=$(find . -iname 'friend-forge-repo*.zip' | head -1); fi
          echo "zip: $Z"
          if [ -n "$Z" ]; then unzip -oq "$Z" -x '.github/*'; fi
          if [ ! -d forge-1.20.1 ]; then
            D=$(dirname "$(find . -type d -name forge-1.20.1 | head -1)" 2>/dev/null)
            echo "project dir guess: $D"
            if [ -n "$D" ] && [ "$D" != "." ]; then cp -r "$D"/. . ; fi
          fi
          echo "--- after unpack:"; ls -la
          test -d forge-1.20.1 || { echo "PROJECT FILES NOT FOUND"; find . -maxdepth 3 -not -path './.git/*' | head -60; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Unpack assets
        run: |
          mkdir -p common/src/main/resources
          if [ -f friend-assets.zip ]; then unzip -oq friend-assets.zip -d common/src/main/resources; else echo "NO friend-assets.zip"; fi
          find common/src/main/resources -type f | head -50
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: gradle build --no-daemon --stacktrace 2>&1 | tee ../build-${{ matrix.mc }}.log
        continue-on-error: true
      - name: Collect result
        run: |
          mkdir -p out
          cp ${{ matrix.dir }}/build/libs/*.jar out/ 2>/dev/null || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: friend-forge-${{ matrix.mc }}
          path: out/*.jar
          if-no-files-found: warn
      - name: Publish log to ci-logs
        if: always()
        run: |
          tail -n 250 build-${{ matrix.mc }}.log > tail.log || echo "no log" > tail.log
          git config user.name ci; git config user.email ci@example.com
          rm -rf /tmp/logs; git clone --depth 1 --branch ci-logs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/logs 2>/dev/null || (mkdir /tmp/logs && cd /tmp/logs && git init -q && git checkout -q -b ci-logs && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git")
          cd /tmp/logs
          cp $GITHUB_WORKSPACE/tail.log ${{ matrix.mc }}.log
          echo "$GITHUB_SHA $(date -u)" > ${{ matrix.mc }}.meta
          ls $GITHUB_WORKSPACE/out/*.jar >/dev/null 2>&1 && echo OK >> ${{ matrix.mc }}.meta || echo FAIL >> ${{ matrix.mc }}.meta
          git config user.name ci; git config user.email ci@example.com
          git add -A; git commit -qm "log ${{ matrix.mc }}" || true
          git pull --rebase origin ci-logs 2>/dev/null || true
          git push origin ci-logs
